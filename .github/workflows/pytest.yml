name: pytest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --group dev

      - name: Run tests
        if: matrix.python-version == '3.14'
        run: uv run pytest

      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: uv run pytest --cov=smoothcon --cov-report=xml

      - name: Generate coverage badge
        if: matrix.python-version == '3.13'
        run: uv run genbadge coverage -i coverage.xml -o tests/coverage.svg

      - name: Fix coverage badge
        if: matrix.python-version == '3.13'
        run: |
          if ! uv run pre-commit run end-of-file-fixer --files tests/coverage.svg; then
            uv run pre-commit run end-of-file-fixer --files tests/coverage.svg
          fi

      - name: Build package
        if: matrix.python-version == '3.13'
        run: uv build

      - name: Commit coverage badge
        if: matrix.python-version == '3.13' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/coverage.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update coverage badge"
          fi
          git push
